# ──────────────────────────────────────────────────────────────────────────────
#  LLM Inference Engine Benchmark Suite
#  Engines : AirLLM · llama.cpp · Ollama · vLLM
# ──────────────────────────────────────────────────────────────────────────────

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ['GPU-87f6dc71-4699-4fff-6e3a-7d7f6511178f']
            capabilities: [gpu]
  environment:
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility

x-volumes: &common-volumes
  - ./models:/models:ro
  - ./results:/results

networks:
  bench-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:

services:

  # ── Orchestrator ─────────────────────────────────────────────────────────────
  orchestrator:
    build: ./orchestrator
    container_name: bench-orchestrator
    depends_on:
      airllm:    { condition: service_healthy }
      llamacpp:  { condition: service_healthy }
      ollama:    { condition: service_healthy }
      vllm:      { condition: service_healthy }
    environment:
      - AIRLLM_URL=http://airllm:8080
      - LLAMACPP_URL=http://llamacpp:8080
      - OLLAMA_URL=http://ollama:11434
      - VLLM_URL=http://vllm:8000
      - MODEL_NAME=${MODEL_NAME:-mistral}
      - BENCH_PROMPTS_FILE=/app/prompts.json
      - OUTPUT_DIR=/results
      - CONCURRENCY=${CONCURRENCY:-1,4,8}
      - NUM_TOKENS=${NUM_TOKENS:-256}
      - WARMUP_REQUESTS=${WARMUP_REQUESTS:-3}
    volumes:
      - ./results:/results
      - ./orchestrator/prompts.json:/app/prompts.json:ro
    networks: [bench-net]
    restart: "no"

  # ── AirLLM ───────────────────────────────────────────────────────────────────
  airllm:
    build: ./engines/airllm
    container_name: bench-airllm
    <<: *gpu
    environment:
      - MODEL_PATH=/models/Qwen/Qwen2.5-7B-Instruct
      - PORT=8080
      - COMPRESSION=${AIRLLM_COMPRESSION:-4bit}
      - AIRLLM_CACHE=/cache/airllm
    volumes: 
      - ./models:/models:ro
      - ./results:/results
      - ./cache/airllm:/cache/airllm
    ports:
      - "8081:8080"
    networks: [bench-net]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 300s

  # ── llama.cpp ────────────────────────────────────────────────────────────────
  llamacpp:
    build: ./engines/llamacpp
    container_name: bench-llamacpp
    command:
      - "--model"
      - "/models/qwen2.5-7b-instruct-q3_k_m.gguf"
      - "--port"
      - "8080"
      - "--host"
      - "0.0.0.0"
      - "--n-gpu-layers"
      - "99"
      - "--ctx-size"
      - "4096"
      - "--parallel"
      - "4"
    <<: *gpu
    environment:
      - MODEL_PATH=/models/${GGUF_MODEL:-qwen2.5-7b-instruct-q3_k_m.gguf}
      - PORT=8080
      - N_GPU_LAYERS=${N_GPU_LAYERS:-99}
      - CTX_SIZE=${CTX_SIZE:-4096}
      - N_PARALLEL=${N_PARALLEL:-4}
    volumes: *common-volumes
    ports:
      - "8082:8080"
    networks: [bench-net]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ── Ollama ───────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: bench-ollama
    <<: *gpu
    environment:
      - OLLAMA_MODELS=/models/ollama
      - OLLAMA_NUM_PARALLEL=${N_PARALLEL:-4}
    volumes:
      - ./models/ollama:/models/ollama
      - ./results:/results
    ports:
      - "11434:11434"
    networks: [bench-net]
    healthcheck:
      test: ["CMD", "/bin/ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ── vLLM ─────────────────────────────────────────────────────────────────────
  vllm:
    image: vllm/vllm-openai:latest
    container_name: bench-vllm
    <<: *gpu
    command: >
      --model /models/Qwen/Qwen2.5-7B-Instruct-AWQ
      --quantization awq
      --host 0.0.0.0
      --port 8000
      --max-model-len 2048
      --gpu-memory-utilization 0.85
      --dtype float16
      --enforce-eager
    volumes: *common-volumes
    ports:
      - "8000:8000"
    networks: [bench-net]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    shm_size: "8g"

  # ── Dashboard ────────────────────────────────────────────────────────────────
  dashboard:
    build: ./dashboard
    container_name: bench-dashboard
    <<: *gpu
    ports:
      - "8090:8090"
    volumes:
      - ./results:/results
      - ./orchestrator/runner.py:/app/runner.py:ro
      - ./orchestrator/prompts.json:/app/prompts.json:ro
    environment:
      - AIRLLM_URL=http://airllm:8080
      - LLAMACPP_URL=http://llamacpp:8080
      - OLLAMA_URL=http://ollama:11434
      - OUTPUT_DIR=/results
      - MODEL_NAME=${MODEL_NAME:-mistral}
      - CONCURRENCY=${CONCURRENCY:-1,4,8}
      - NUM_TOKENS=${NUM_TOKENS:-256}
      - WARMUP_REQUESTS=${WARMUP_REQUESTS:-3}
    networks: [bench-net]
    restart: unless-stopped

  # ── Prometheus ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: bench-prometheus
    command: --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [bench-net]
    profiles: [monitoring]

  # ── Grafana ───────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: bench-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    networks: [bench-net]
    depends_on: [prometheus]
    profiles: [monitoring]

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.0-ubuntu22.04
    container_name: bench-dcgm
    <<: *gpu
    networks: [bench-net]
    profiles: [monitoring]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: bench-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [bench-net]
    profiles: [monitoring]
