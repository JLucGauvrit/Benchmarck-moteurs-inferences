# ──────────────────────────────────────────────────────────────────────────────
#  LLM Inference Engine Benchmark Suite
#  Engines : AirLLM · llama.cpp · Ollama · vLLM
# ──────────────────────────────────────────────────────────────────────────────

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  environment:
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility

x-volumes: &common-volumes
  - ./models:/models:ro
  - ./results:/results

networks:
  bench-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:

services:

  # ── Orchestrator ─────────────────────────────────────────────────────────────
  orchestrator:
    build: ./orchestrator
    container_name: bench-orchestrator
    depends_on:
      airllm:    { condition: service_healthy }
      llamacpp:  { condition: service_healthy }
      ollama:    { condition: service_healthy }
      # vllm:      { condition: service_healthy }
    environment:
      - AIRLLM_URL=http://airllm:8080
      - LLAMACPP_URL=http://llamacpp:8080
      - OLLAMA_URL=http://ollama:11434
      - VLLM_URL=http://vllm:8000
      - MODEL_NAME=${MODEL_NAME:-mistral}
      - BENCH_PROMPTS_FILE=/app/prompts.json
      - OUTPUT_DIR=/results
      - CONCURRENCY=${CONCURRENCY:-1,4,8}
      - NUM_TOKENS=${NUM_TOKENS:-256}
      - WARMUP_REQUESTS=${WARMUP_REQUESTS:-3}
    volumes:
      - ./results:/results
      - ./orchestrator/prompts.json:/app/prompts.json:ro
    networks: [bench-net]
    restart: "no"

  # ── AirLLM ───────────────────────────────────────────────────────────────────
  airllm:
    build: ./engines/airllm
    container_name: bench-airllm
    <<: *gpu
    environment:
      - MODEL_PATH=/models/${MODEL_NAME:-mistralai/Mistral-7B-v0.1}
      - PORT=8080
      - COMPRESSION=${AIRLLM_COMPRESSION:-4bit}
    volumes: *common-volumes
    ports:
      - "8081:8080"
    networks: [bench-net]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  # ── llama.cpp ────────────────────────────────────────────────────────────────
  llamacpp:
    build: ./engines/llamacpp
    container_name: bench-llamacpp
    <<: *gpu
    environment:
      - MODEL_PATH=/models/${GGUF_MODEL:-mistral-7b-q4_k_m.gguf}
      - PORT=8080
      - N_GPU_LAYERS=${N_GPU_LAYERS:-99}
      - CTX_SIZE=${CTX_SIZE:-4096}
      - N_PARALLEL=${N_PARALLEL:-4}
    volumes: *common-volumes
    ports:
      - "8082:8080"
    networks: [bench-net]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ── Ollama ───────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: bench-ollama
    <<: *gpu
    environment:
      - OLLAMA_MODELS=/models/ollama
      - OLLAMA_NUM_PARALLEL=${N_PARALLEL:-4}
    volumes:
      - ./models/ollama:/models/ollama
      - ./results:/results
    ports:
      - "11434:11434"
    networks: [bench-net]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ── vLLM ─────────────────────────────────────────────────────────────────────
  vllm: &disabled
    image: vllm/vllm-openai:latest
    container_name: bench-vllm
    <<: *gpu
    command: >
      --model /models/${MODEL_NAME:-mistralai/Mistral-7B-v0.1}
      --host 0.0.0.0
      --port 8000
      --max-model-len ${CTX_SIZE:-4096}
      --tensor-parallel-size ${TENSOR_PARALLEL:-1}
      --dtype ${DTYPE:-auto}
    volumes: *common-volumes
    ports:
      - "8000:8000"
    networks: [bench-net]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    shm_size: "8g"

  # ── Prometheus ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: bench-prometheus
    command: --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [bench-net]
    profiles: [monitoring]

  # ── Grafana ───────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: bench-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    networks: [bench-net]
    depends_on: [prometheus]
    profiles: [monitoring]
